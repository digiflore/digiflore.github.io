<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable — Digiflore</title>
  <link rel="icon" href="./img/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Lora:ital@1&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --cream: #FAF5EF;
      --beige: #F0E3D0;
      --border: #EAD9C8;
      --accent: #C9A88A;
      --brown-dark: #2A2118;
      --brown-mid: #6B4F3A;
      --brown-muted: #9C8472;
      --footer-bg: #F0E3D0;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 400;
      background: var(--cream);
      color: var(--brown-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2.5rem;
      background: var(--cream);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--brown-dark);
      text-decoration: none;
    }

    .nav-logo img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      image-rendering: pixelated;
    }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
      gap: 1.25rem;
    }

    .error-code {
      font-family: 'Lora', serif;
      font-style: italic;
      font-size: 96px;
      color: var(--border);
      line-height: 1;
    }

    .error-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--brown-dark);
    }

    .error-desc {
      font-size: 14px;
      line-height: 1.7;
      color: var(--brown-muted);
      max-width: 360px;
    }

    .btn {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--beige);
      color: var(--brown-dark);
      transition: transform 0.15s, border-color 0.2s;
      margin-top: 0.5rem;
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    /* ── FOOTER ── */
    footer {
      padding: 1.25rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--footer-bg);
      border-top: 1px solid var(--border);
    }

    .footer-copy {
      font-size: 11px;
      color: var(--brown-muted);
      letter-spacing: 0.5px;
    }

    footer a {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: var(--brown-mid);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--brown-dark);
    }

    @media (max-width: 640px) {
      nav {
        padding: 1rem 1.25rem;
      }

      footer {
        flex-direction: column;
        gap: 0.5rem;
        text-align: center;
      }

      .error-code {
        font-size: 72px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="./index.html" class="nav-logo">
      <img src="./img/digiflore - logo.png" alt="Logo Digiflore" />
      Digiflore
    </a>
  </nav>

  <main>
    <p class="error-code">404</p>
    <p class="error-title">Page introuvable</p>
    <p class="error-desc">Cette page n'existe pas ou a été déplacée. Pas de panique, tu peux retourner à l'accueil ✨</p>
    <a href="./index.html" class="btn">← Retour à l'accueil</a>
  </main>

  <footer>
    <span class="footer-copy">© 2026 Digiflore</span>
    <a href="./pages/contact.html">Contact →</a>
  </footer>

</body>

</html>
